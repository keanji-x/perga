<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交付拓扑 · 并行审查与修复闭环</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fdfcfa;
      --paper: #fdfcfa;
      --text: #1e2026;
      --text-2: #525763;
      --text-3: #868b98;
      --hairline: #ddd9d0;
      --accent: #3955b8;
      --ok: #26734d;
      --warn: #b45309;
      --danger: #b9382c;
      --surface-soft: rgba(30, 32, 38, 0.036);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #24272e;
        --paper: #24272e;
        --text: #eef0f4;
        --text-2: #b5bac7;
        --text-3: #828898;
        --hairline: #3d4350;
        --accent: #86a0ff;
        --ok: #65c493;
        --warn: #ebb057;
        --danger: #e87a70;
        --surface-soft: rgba(255, 255, 255, 0.045);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .wrap {
      padding: 2px 2px 4px;
    }

    .graph-shell {
      position: relative;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .graph-stage {
      position: relative;
      width: 100%;
      min-width: 580px;
      height: 186px;
    }

    .graph-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .edge {
      fill: none;
      stroke: var(--hairline);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .edge-done { stroke: var(--text-3); opacity: 0.72; }
    .edge-active { stroke: var(--accent); stroke-width: 1.75; }
    .edge-loop {
      fill: none;
      stroke: var(--warn);
      stroke-width: 1.35;
      stroke-dasharray: 4 3.5;
      opacity: 0.85;
    }
    .edge-loop-pass {
      stroke: var(--text-3);
      opacity: 0.55;
    }

    .loop-caption {
      position: absolute;
      top: 2px;
      left: 46%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3);
      background: var(--bg);
      padding: 1px 8px;
      white-space: nowrap;
      z-index: 3;
    }

    .loop-caption-active { color: var(--warn); }

    .node-btn {
      position: absolute;
      z-index: 2;
      transform: translate(-50%, -50%);
      appearance: none;
      border: 1px solid transparent;
      background: var(--bg);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      color: var(--text-2);
      transition: border-color 120ms ease, background-color 120ms ease, color 120ms ease;
    }

    .node-btn:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .node-btn[aria-pressed="true"] {
      border-color: var(--hairline);
      background: var(--surface-soft);
      color: var(--text);
    }

    .node-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .dot {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.6px solid var(--hairline);
      background: var(--bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }

    .dot-done {
      border-color: var(--text);
      background: var(--text);
      color: var(--bg);
    }

    .dot-running {
      border-color: var(--accent);
      background: var(--bg);
    }

    .dot-running::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot-blocked {
      border-color: var(--danger);
      background: var(--bg);
      color: var(--danger);
    }

    .node-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .node-title {
      font-size: 12.5px;
      font-weight: 560;
      color: var(--text);
      white-space: nowrap;
    }

    .node-btn[aria-pressed="true"] .node-title { font-weight: 680; }

    .node-meta {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-3);
      white-space: nowrap;
    }

    .node-meta-running { color: var(--accent); }
    .node-meta-blocked { color: var(--danger); }
    .node-meta-ok { color: var(--ok); }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const root = document.documentElement;
      const app = document.getElementById("app");
      let currentData = null;
      let selectedId = null;
      let redrawEdges = null;

      function reportHeight() {
        const rect = app.getBoundingClientRect();
        const h = Math.ceil(rect.height || document.body.scrollHeight);
        window.parent.postMessage({ type: "perga:resize", height: Math.max(h, 140) }, "*");
      }

      function applyTheme(msg) {
        const t = msg.tokens || {};
        if (msg.scheme === "dark" || msg.scheme === "light") {
          root.style.colorScheme = msg.scheme;
        }
        if (t.bg) root.style.setProperty("--bg", t.bg);
        if (t.paper) root.style.setProperty("--paper", t.paper);
        if (t.text) root.style.setProperty("--text", t.text);
        if (t.text2) root.style.setProperty("--text-2", t.text2);
        if (t.text3) root.style.setProperty("--text-3", t.text3);
        if (t.hairline) root.style.setProperty("--hairline", t.hairline);
        if (t.accent) root.style.setProperty("--accent", t.accent);
        if (t.fontSans) root.style.setProperty("--font-sans", t.fontSans);
        if (t.fontMono) root.style.setProperty("--font-mono", t.fontMono);
      }

      function statusMeta(node) {
        if (node.verdict === "changes_requested" || node.status === "blocked") {
          return { label: "打回修复", cls: "node-meta-blocked", dot: "dot-blocked", glyph: "×" };
        }
        if (node.status === "done" || node.verdict === "pass") {
          return { label: "已通过", cls: "node-meta-ok", dot: "dot-done", glyph: "✓" };
        }
        if (node.status === "running") {
          return { label: "进行中", cls: "node-meta-running", dot: "dot-running", glyph: "" };
        }
        return { label: "待触发", cls: "", dot: "", glyph: "" };
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS(SVG_NS, tag);
        Object.keys(attrs).forEach((k) => el.setAttribute(k, String(attrs[k])));
        return el;
      }

      function render() {
        app.textContent = "";
        if (!currentData || typeof currentData !== "object") {
          reportHeight();
          return;
        }

        const design = currentData.design || { id: "design", title: "设计", status: "pending" };
        const impl = currentData.implement || { id: "implement", title: "实现与修复", status: "pending" };
        const reviews = Array.isArray(currentData.reviews) && currentData.reviews.length > 0
          ? currentData.reviews
          : [{ id: "review-a", title: "Review A", status: "pending" }];
        const merge = currentData.merge || { id: "merge", title: "验证合入", status: "pending" };
        const rounds = Array.isArray(currentData.rounds) ? currentData.rounds : [];
        const currentRound = typeof currentData.currentRound === "number" ? currentData.currentRound : 1;

        const allNodes = [design, impl, ...reviews, merge];
        if (!selectedId || !allNodes.some((n) => n.id === selectedId)) {
          selectedId = currentData.defaultSelectedId
            || (allNodes.find((n) => n.status === "blocked" || n.verdict === "changes_requested")
              || allNodes.find((n) => n.status === "running")
              || reviews[0]
              || impl).id;
        }

        const hasRework = currentRound > 1 || rounds.some((r) => r.outcome === "changes_requested")
          || reviews.some((r) => r.verdict === "changes_requested" || r.status === "blocked");
        const loopActive = reviews.some((r) => r.verdict === "changes_requested" || r.status === "blocked")
          || (currentRound > 1 && impl.status === "running");

        const graphShell = document.createElement("div");
        graphShell.className = "graph-shell";

        const stage = document.createElement("div");
        stage.className = "graph-stage";
        const laneCount = Math.max(reviews.length, 1);
        const stageHeight = laneCount <= 1 ? 156 : laneCount === 2 ? 186 : 68 + laneCount * 58;
        stage.style.height = stageHeight + "px";

        const svg = svgEl("svg", { class: "graph-svg", "aria-hidden": "true" });
        stage.appendChild(svg);

        const midY = Math.round(stageHeight * 0.58);
        const xDesignPct = 9;
        const xImplPct = 30.5;
        const xReviewPct = 62;
        const xMergePct = 90.5;

        const reviewYs = laneCount === 1
          ? [midY]
          : reviews.map((_, i) => {
              const topY = Math.round(stageHeight * 0.36);
              const botY = Math.round(stageHeight * 0.82);
              return Math.round(topY + ((botY - topY) * i) / (laneCount - 1));
            });

        const loopCap = document.createElement("div");
        loopCap.className = "loop-caption" + (loopActive ? " loop-caption-active" : "");
        if (loopActive) {
          loopCap.textContent = "↩ 打回修复闭环 · R" + currentRound + " 处理中";
        } else if (hasRework) {
          loopCap.textContent = "↩ 修复闭环 · 共 " + currentRound + " 轮（已收口）";
        } else {
          loopCap.textContent = "↩ Review 发现阻断则打回实现修复";
        }
        stage.appendChild(loopCap);

        const nodeEls = {};
        function placeNode(node, xPct, yPx, extraSub) {
          const meta = statusMeta(node);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "node-btn";
          btn.style.left = xPct + "%";
          btn.style.top = yPx + "px";
          btn.setAttribute("aria-pressed", String(node.id === selectedId));

          const dot = document.createElement("span");
          dot.className = "dot " + meta.dot;
          dot.textContent = meta.glyph;

          const textWrap = document.createElement("span");
          textWrap.className = "node-text";

          const titleEl = document.createElement("span");
          titleEl.className = "node-title";
          titleEl.textContent = node.title;

          const subEl = document.createElement("span");
          subEl.className = "node-meta " + meta.cls;
          subEl.textContent = extraSub || meta.label;

          textWrap.append(titleEl, subEl);
          btn.append(dot, textWrap);

          btn.addEventListener("click", () => {
            selectedId = node.id;
            window.parent.postMessage({ type: "perga:intent", kind: "select", key: "node", value: node.id }, "*");
            render();
          });
          stage.appendChild(btn);
          nodeEls[node.id] = btn;
        }

        placeNode(design, xDesignPct, midY);
        placeNode(impl, xImplPct, midY, currentRound > 1 ? ("R" + currentRound + " · " + statusMeta(impl).label) : statusMeta(impl).label);
        reviews.forEach((rev, i) => {
          const revMeta = statusMeta(rev);
          const sub = typeof rev.round === "number" ? (revMeta.label + " · R" + rev.round) : revMeta.label;
          placeNode(rev, xReviewPct, reviewYs[i], sub);
        });
        placeNode(merge, xMergePct, midY);

        function drawEdges() {
          const sRect = stage.getBoundingClientRect();
          if (!sRect.width || !sRect.height) return;
          svg.setAttribute("viewBox", "0 0 " + sRect.width + " " + sRect.height);
          svg.textContent = "";

          const defs = svgEl("defs", {});
          const marker = svgEl("marker", {
            id: "loop-arrow",
            viewBox: "0 0 8 8",
            refX: "6",
            refY: "4",
            markerWidth: "6",
            markerHeight: "6",
            orient: "auto",
          });
          marker.appendChild(svgEl("path", {
            d: "M 1 1 L 7 4 L 1 7",
            fill: "none",
            stroke: "currentColor",
            "stroke-width": "1.5",
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
          }));
          defs.appendChild(marker);
          svg.appendChild(defs);

          const boxOf = (id) => {
            const el = nodeEls[id];
            if (!el) return null;
            const r = el.getBoundingClientRect();
            return {
              left: r.left - sRect.left,
              right: r.right - sRect.left,
              top: r.top - sRect.top,
              bottom: r.bottom - sRect.top,
              cx: (r.left + r.right) / 2 - sRect.left,
              cy: (r.top + r.bottom) / 2 - sRect.top,
            };
          };

          const bDesign = boxOf(design.id);
          const bImpl = boxOf(impl.id);
          const bMerge = boxOf(merge.id);
          const gap = 6;
          if (!bDesign || !bImpl || !bMerge) return;

          svg.appendChild(svgEl("path", {
            d: `M ${bDesign.right + gap} ${bDesign.cy} L ${bImpl.left - gap} ${bImpl.cy}`,
            class: "edge " + (design.status === "done" ? "edge-done" : ""),
          }));

          let topReviewBox = null;
          let maxReviewRight = 0;
          reviews.forEach((rev) => {
            const bRev = boxOf(rev.id);
            if (!bRev) return;
            if (!topReviewBox || bRev.top < topReviewBox.top) topReviewBox = bRev;
            if (bRev.right > maxReviewRight) maxReviewRight = bRev.right;

            const inClass = rev.status === "running"
              ? "edge edge-active"
              : (impl.status === "done" ? "edge edge-done" : "edge");
            const outClass = (rev.status === "done" || rev.verdict === "pass")
              ? "edge edge-done"
              : (merge.status === "running" ? "edge edge-active" : "edge");

            const c1x = bImpl.right + (bRev.left - bImpl.right) * 0.45;
            const c2x = bRev.left - (bRev.left - bImpl.right) * 0.45;
            svg.appendChild(svgEl("path", {
              d: `M ${bImpl.right + gap} ${bImpl.cy} C ${c1x} ${bImpl.cy}, ${c2x} ${bRev.cy}, ${bRev.left - gap} ${bRev.cy}`,
              class: inClass,
            }));

            const m1x = bRev.right + (bMerge.left - bRev.right) * 0.45;
            const m2x = bMerge.left - (bMerge.left - bRev.right) * 0.45;
            svg.appendChild(svgEl("path", {
              d: `M ${bRev.right + gap} ${bRev.cy} C ${m1x} ${bRev.cy}, ${m2x} ${bMerge.cy}, ${bMerge.left - gap} ${bMerge.cy}`,
              class: outClass,
            }));
          });

          if (topReviewBox) {
            const arcStartX = Math.round(maxReviewRight + (bMerge.left - maxReviewRight) * 0.35);
            const arcStartY = Math.round(bMerge.cy - 18);
            const arcTopY = 18;
            svg.appendChild(svgEl("path", {
              d: `M ${arcStartX} ${arcStartY} C ${arcStartX - 24} ${arcTopY}, ${bImpl.cx + 18} ${arcTopY}, ${bImpl.cx} ${bImpl.top - 8}`,
              class: "edge-loop" + (loopActive ? "" : " edge-loop-pass"),
              style: loopActive ? "color: var(--warn);" : "color: var(--text-3);",
              "marker-end": "url(#loop-arrow)",
            }));
            loopCap.style.left = Math.round((arcStartX + bImpl.cx) / 2) + "px";
          }
        }

        graphShell.appendChild(stage);
        app.appendChild(graphShell);
        redrawEdges = drawEdges;
        requestAnimationFrame(() => {
          drawEdges();
          reportHeight();
        });
      }

      window.addEventListener("message", (ev) => {
        if (ev.source !== window.parent) return;
        const msg = ev.data;
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "perga:theme") {
          applyTheme(msg);
          render();
        } else if (msg.type === "perga:data") {
          currentData = msg.data;
          if (typeof msg.selectedId === "string" && msg.selectedId.trim() !== "") {
            selectedId = msg.selectedId.trim();
          }
          render();
        }
      });

      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => {
          if (redrawEdges) redrawEdges();
          reportHeight();
        }).observe(app);
      }
      window.addEventListener("resize", () => {
        if (redrawEdges) redrawEdges();
        reportHeight();
      });
      window.parent.postMessage({ type: "perga:ready" }, "*");
    })();
  </script>
</body>
</html>

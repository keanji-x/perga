  <line x1="1136" y1="0" x2="1136" y2="630" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="64" y1="110" x2="1136" y2="110" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="64" y1="510" x2="1136" y2="510" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="800" y1="110" x2="800" y2="510" stroke="#d6d1c6" stroke-width="1.5"/>

  <!-- Top masthead -->

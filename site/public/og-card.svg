  <text x="832" y="368" font-family="monospace" font-size="13" fill="#6e7482">03 · CONTROL</text>
  <text x="832" y="396" font-family="-apple-system, sans-serif" font-size="19" fill="#14161a">Cross-Model &amp; Steer</text>

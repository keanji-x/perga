  <text x="142" y="67" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#14161a">Perga</text>
  <text x="1104" y="64" text-anchor="end" font-family="monospace" font-size="15" fill="#6e7482">APACHE 2.0 · MACOS ARM64 &amp; LINUX X64</text>


  <line x1="801" y1="224" x2="1135" y2="224" stroke="#d6d1c6" stroke-width="1"/>

  <text x="832" y="266" font-family="monospace" font-size="13" fill="#6e7482">02 · MEMORY</text>
  <text x="832" y="294" font-family="-apple-system, sans-serif" font-size="19" fill="#14161a">Governed Shared MD</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <!-- Swiss outer architectural frame -->
  <line x1="64" y1="0" x2="64" y2="630" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="1136" y1="0" x2="1136" y2="630" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="64" y1="110" x2="1136" y2="110" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="64" y1="510" x2="1136" y2="510" stroke="#d6d1c6" stroke-width="1.5"/>
  <line x1="800" y1="110" x2="800" y2="510" stroke="#d6d1c6" stroke-width="1.5"/>

  <!-- Top masthead with official Perga snow crystal mark -->
  <svg x="94" y="40" width="36" height="36" viewBox="0 0 384 384">
    <g fill="none" stroke="#3C528D" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 192 36 L 192 158 L 88 98" />
      <path d="M 192 36 L 192 158 L 88 98" transform="rotate(120 192 192)" />
      <path d="M 192 36 L 192 158 L 88 98" transform="rotate(240 192 192)" />
    </g>
  </svg>
  <text x="142" y="67" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#14161a">Perga</text>
  <text x="1104" y="64" text-anchor="end" font-family="monospace" font-size="15" fill="#6e7482">APACHE 2.0 · MACOS ARM64 &amp; LINUX X64</text>

  <!-- Left display typography -->
  <text x="96" y="232" font-family="Georgia, serif" font-size="78" font-weight="500" fill="#14161a">Chat drifts.</text>
  <text x="96" y="318" font-family="Georgia, serif" font-style="italic" font-size="78" font-weight="400" fill="#3955b8">Reports stay.</text>
  <text x="96" y="384" font-family="-apple-system, sans-serif" font-size="23" fill="#444954">A report-centric local workspace for Claude Code &amp; Codex.</text>

  <!-- Right colophon -->
  <rect x="801" y="111" width="334" height="398" fill="#fdfcfa"/>
  <text x="832" y="164" font-family="monospace" font-size="13" fill="#6e7482">01 · REPORT-CENTRIC</text>
  <text x="832" y="192" font-family="-apple-system, sans-serif" font-size="19" fill="#14161a">Living Reports &amp; Flows</text>
  <line x1="801" y1="224" x2="1135" y2="224" stroke="#d6d1c6" stroke-width="1"/>

  <text x="832" y="266" font-family="monospace" font-size="13" fill="#6e7482">02 · CROSS-MODEL</text>
  <text x="832" y="294" font-family="-apple-system, sans-serif" font-size="19" fill="#14161a">Claude Impl · Codex Audit</text>
  <line x1="801" y1="326" x2="1135" y2="326" stroke="#d6d1c6" stroke-width="1"/>

  <text x="832" y="368" font-family="monospace" font-size="13" fill="#6e7482">03 · SHARED MEMORY</text>
  <text x="832" y="396" font-family="-apple-system, sans-serif" font-size="19" fill="#14161a">Markdown Across CLIs</text>
  <line x1="801" y1="428" x2="1135" y2="428" stroke="#d6d1c6" stroke-width="1"/>

  <text x="832" y="472" font-family="monospace" font-size="13" fill="#1f6b48">SELF-CONTAINED · NO .NET REQ</text>

  <!-- Dark bottom install strip -->
  <rect x="64" y="510" width="1072" height="120" fill="#15171c"/>
  <text x="96" y="577" font-family="monospace" font-size="20" fill="#7ea3ff">$</text>
  <text x="122" y="577" font-family="monospace" font-size="20" fill="#f3f1eb">curl -fsSL https://keanji-x.github.io/perga/install.sh | bash</text>
  <text x="1104" y="577" text-anchor="end" font-family="monospace" font-size="16" fill="#a9afb9">github.com/keanji-x/perga</text>

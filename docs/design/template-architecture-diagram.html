<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perga 模板底层架构 v2：封闭原语 × 开放模板 × 方案 B 统一 VO</title>
  <style>
    :root {
      --bg: #fdfcfa;
      --surface: #ffffff;
      --subgraph-logic: #f6f4ee;
      --subgraph-data: #f4f7f5;
      --subgraph-vo: #f3f5fa;
      --hairline: #e4e0d8;
      --hairline-strong: #cbc5b8;
      --text: #1e2026;
      --text-2: #525763;
      --text-3: #868b98;
      --accent-logic: #9d5b1a;
      --accent-data: #24724a;
      --accent-vo: #3955b8;
      --closed-bg: rgba(30, 32, 38, 0.075);
      --closed-txt: #2b2f38;
      --open-bg: rgba(57, 85, 184, 0.10);
      --open-txt: #314ba6;
      --edge: #7c8290;
      --edge-dashed: #5a6da8;
      --edge-active: #1e2026;
      --pill-bg: #fdfcfa;
      --chip-bg: rgba(30, 32, 38, 0.045);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "New York", Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #24272e;
        --surface: #2c3039;
        --subgraph-logic: #292724;
        --subgraph-data: #232b28;
        --subgraph-vo: #252935;
        --hairline: #3b404d;
        --hairline-strong: #515868;
        --text: #eef0f4;
        --text-2: #b5bac7;
        --text-3: #828898;
        --accent-logic: #e2a252;
        --accent-data: #54c086;
        --accent-vo: #86a0ff;
        --closed-bg: rgba(255, 255, 255, 0.10);
        --closed-txt: #dce0ea;
        --open-bg: rgba(134, 160, 255, 0.16);
        --open-txt: #9fb4ff;
        --edge: #8e96a8;
        --edge-dashed: #8fa6ee;
        --edge-active: #ffffff;
        --pill-bg: #24272e;
        --chip-bg: rgba(255, 255, 255, 0.07);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px 14px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px 20px;
      margin-bottom: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--hairline);
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-3);
    }

    .mode-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .mode-btn:hover {
      color: var(--text);
      background: var(--chip-bg);
    }

    .mode-btn[aria-pressed="true"] {
      color: var(--text);
      background: var(--surface);
      border-color: var(--hairline-strong);
      font-weight: 550;
    }

    .diagram-wrap {
      width: 100%;
      overflow-x: auto;
    }

    svg.arch {
      display: block;
      width: 100%;
      min-width: 800px;
      height: auto;
      user-select: none;
    }

    .sg-box {
      rx: 10px;
      ry: 10px;
      stroke-width: 1;
    }
    .sg-logic { fill: var(--subgraph-logic); stroke: var(--hairline); }
    .sg-data  { fill: var(--subgraph-data);  stroke: var(--hairline); }
    .sg-vo    { fill: var(--subgraph-vo);    stroke: var(--hairline); }

    .sg-eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .sg-title {
      font-family: var(--font-sans);
      font-size: 12.8px;
      font-weight: 650;
      fill: var(--text);
    }

    .node {
      cursor: pointer;
      transition: opacity 180ms ease;
    }
    .node-rect {
      fill: var(--surface);
      stroke: var(--hairline-strong);
      stroke-width: 1;
      rx: 7px;
      ry: 7px;
      transition: stroke 160ms ease, stroke-width 160ms ease;
    }
    .node[data-open="true"] .node-rect {
      stroke-dasharray: 4 2.5;
    }
    .node:hover .node-rect,
    .node.is-active .node-rect {
      stroke-width: 1.75;
      stroke-dasharray: none;
    }
    .node[data-layer="logic"]:hover .node-rect,
    .node[data-layer="logic"].is-active .node-rect { stroke: var(--accent-logic); }
    .node[data-layer="data"]:hover .node-rect,
    .node[data-layer="data"].is-active .node-rect  { stroke: var(--accent-data); }
    .node[data-layer="vo"]:hover .node-rect,
    .node[data-layer="vo"].is-active .node-rect    { stroke: var(--accent-vo); }

    .node-bar { rx: 2px; ry: 2px; }
    .bar-logic { fill: var(--accent-logic); }
    .bar-data  { fill: var(--accent-data); }
    .bar-vo    { fill: var(--accent-vo); }

    .node-title {
      font-family: var(--font-sans);
      font-size: 12.6px;
      font-weight: 630;
      fill: var(--text);
    }
    .node-sub {
      font-family: var(--font-sans);
      font-size: 10.8px;
      fill: var(--text-2);
    }
    .node-mono {
      font-family: var(--font-mono);
      font-size: 9.6px;
      letter-spacing: -0.015em;
      fill: var(--text-2);
    }

    .badge-closed-bg { fill: var(--closed-bg); rx: 3.5px; ry: 3.5px; }
    .badge-closed-txt { font-family: var(--font-sans); font-size: 9.2px; font-weight: 600; fill: var(--closed-txt); }
    .badge-open-bg { fill: var(--open-bg); rx: 3.5px; ry: 3.5px; }
    .badge-open-txt { font-family: var(--font-sans); font-size: 9.2px; font-weight: 600; fill: var(--open-txt); }

    .chip-bg { fill: var(--chip-bg); rx: 4px; ry: 4px; }
    .chip-txt { font-family: var(--font-mono); font-size: 9.5px; fill: var(--text-2); }

    .edge { transition: opacity 180ms ease; }
    .edge-path {
      fill: none;
      stroke: var(--edge);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 160ms ease, stroke-width 160ms ease;
    }
    .edge-dashed .edge-path {
      stroke: var(--edge-dashed);
      stroke-dasharray: 5 4;
    }
    .edge.is-active .edge-path { stroke: var(--edge-active); stroke-width: 2; }
    .edge-dashed.is-active .edge-path { stroke: var(--accent-vo); }
    .edge[data-accent="data"].is-active .edge-path { stroke: var(--accent-data); }
    .edge[data-accent="logic"].is-active .edge-path { stroke: var(--accent-logic); }

    .label-pill {
      fill: var(--pill-bg);
      stroke: var(--hairline);
      stroke-width: 0.8;
      rx: 4px;
      ry: 4px;
    }
    .edge-label {
      font-family: var(--font-sans);
      font-size: 10.2px;
      fill: var(--text-2);
    }
    .edge.is-active .edge-label {
      fill: var(--text);
      font-weight: 600;
    }

    .is-dim { opacity: 0.20; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid var(--hairline);
      font-size: 11.8px;
      color: var(--text-2);
      min-height: 28px;
    }

    .footer-note { line-height: 1.45; }
    .footer-note strong { color: var(--text); font-weight: 600; }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
      font-size: 10.8px;
      color: var(--text-3);
      white-space: nowrap;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-box-closed { width: 12px; height: 10px; border: 1.2px solid var(--hairline-strong); border-radius: 2px; background: var(--surface); }
    .legend-box-open { width: 12px; height: 10px; border: 1.2px dashed var(--accent-vo); border-radius: 2px; background: var(--surface); }
    .legend-solid { width: 15px; height: 0; border-top: 1.5px solid var(--edge); }
    .legend-dashed { width: 15px; height: 0; border-top: 1.5px dashed var(--edge-dashed); }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="header">
      <div class="title-group">
        <h1 class="title">Data / VO / Logic 架构 v2（封闭原语 × 开放模板 × 方案 B 统一 VO）</h1>
        <span class="subtitle">实线框 = 封闭内核原语 · 虚线框 = 开放模板空间</span>
      </div>
      <div class="mode-bar" role="toolbar" aria-label="链路视角切换">
        <button class="mode-btn" type="button" data-mode="all" aria-pressed="true">全景</button>
        <button class="mode-btn" type="button" data-mode="zero-token" aria-pressed="false">① 0-Token 采集与校验</button>
        <button class="mode-btn" type="button" data-mode="escalate" aria-pressed="false">② 越界拉起 Worker</button>
        <button class="mode-btn" type="button" data-mode="vo-b" aria-pressed="false">③ 方案 B 双轨 VO</button>
      </div>
    </div>

    <div class="diagram-wrap">
      <svg class="arch" viewBox="0 0 1140 554" role="img" aria-label="Perga 模板 v2 Data VO Logic 架构图">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
            <path d="M 1 1.8 L 8.8 5 L 1 8.2 z" fill="var(--edge)" />
          </marker>
          <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
            <path d="M 1 1.8 L 8.8 5 L 1 8.2 z" fill="var(--edge-dashed)" />
          </marker>
          <marker id="arrow-logic" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
            <path d="M 1 1.8 L 8.8 5 L 1 8.2 z" fill="var(--accent-logic)" />
          </marker>
          <marker id="arrow-data" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
            <path d="M 1 1.8 L 8.8 5 L 1 8.2 z" fill="var(--accent-data)" />
          </marker>
          <marker id="arrow-vo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
            <path d="M 1 1.8 L 8.8 5 L 1 8.2 z" fill="var(--accent-vo)" />
          </marker>
        </defs>

        <!-- ==================== SUBGRAPHS ==================== -->
        <g class="sg">
          <rect class="sg-box sg-logic" x="18" y="46" width="332" height="452" />
          <text class="sg-eyebrow" x="34" y="68" fill="var(--accent-logic)">01 · LOGIC</text>
          <text class="sg-title" x="112" y="68">封闭执行原语 × 开放规则</text>
        </g>

        <g class="sg">
          <rect class="sg-box sg-data" x="434" y="46" width="286" height="452" />
          <text class="sg-eyebrow" x="450" y="68" fill="var(--accent-data)">02 · DATA</text>
          <text class="sg-title" x="522" y="68">系统事实 × 开放 Schema</text>
        </g>

        <g class="sg">
          <rect class="sg-box sg-vo" x="804" y="46" width="318" height="452" />
          <text class="sg-eyebrow" x="820" y="68" fill="var(--accent-vo)">03 · VO（方案 B）</text>
          <text class="sg-title" x="932" y="68">统一契约 · 双轨挂载</text>
        </g>

        <!-- ==================== EDGES ==================== -->
        <!-- Top feedback bus: OD -> TR -->
        <g class="edge edge-dashed" id="e-od-tr" data-from="OD" data-to="TR" data-accent="logic" data-modes="escalate">
          <path class="edge-path" d="M 704 218 L 714 218 L 714 22 L 274 22 L 274 86" marker-end="url(#arrow-dashed)" />
          <rect class="label-pill" x="378" y="10" width="228" height="22" />
          <text class="edge-label" x="492" y="25" text-anchor="middle">data_change / schedule_at（maxDepth=2）</text>
        </g>

        <!-- Logic internal: TR -> CLI -->
        <g class="edge" id="e-tr-cli" data-from="TR" data-to="CLI" data-accent="logic" data-modes="zero-token">
          <path class="edge-path" d="M 118 158 L 118 192" marker-end="url(#arrow)" />
          <text class="edge-label" x="128" y="179">廉价优先 · 0 Token</text>
        </g>

        <!-- Logic internal: TR -> RT (via right inner gutter x=332) -->
        <g class="edge" id="e-tr-rt" data-from="TR" data-to="RT" data-accent="logic" data-modes="escalate">
          <path class="edge-path" d="M 308 122 L 332 122 L 332 332 L 310 332" marker-end="url(#arrow)" />
          <rect class="label-pill" x="220" y="272" width="116" height="20" />
          <text class="edge-label" x="278" y="286" text-anchor="middle">越界 / 决策 / 复核</text>
        </g>

        <!-- Logic internal: RT -> WK -->
        <g class="edge" id="e-rt-wk" data-from="RT" data-to="WK" data-accent="logic" data-modes="escalate">
          <path class="edge-path" d="M 171 368 L 171 402" marker-end="url(#arrow)" />
          <text class="edge-label" x="181" y="389">enforce: true 强校验</text>
        </g>

        <!-- Logic -> Data: CLI -> OD (Schema Fail-Closed) -->
        <g class="edge" id="e-cli-od" data-from="CLI" data-to="OD" data-accent="data" data-modes="zero-token">
          <path class="edge-path" d="M 308 228 L 448 228" marker-end="url(#arrow)" />
          <rect class="label-pill" x="352" y="203" width="82" height="20" />
          <text class="edge-label" x="393" y="217" text-anchor="middle">Schema 校验</text>
        </g>

        <!-- Logic -> Data: WK -> OD -->
        <g class="edge" id="e-wk-od" data-from="WK" data-to="OD" data-accent="data" data-modes="escalate">
          <path class="edge-path" d="M 308 420 L 392 420 L 392 278 L 448 278" marker-end="url(#arrow)" />
          <rect class="label-pill" x="342" y="336" width="100" height="20" />
          <text class="edge-label" x="392" y="350" text-anchor="middle">perga_data_patch</text>
        </g>

        <!-- Logic -> Data: WK -> FS -->
        <g class="edge" id="e-wk-fs" data-from="WK" data-to="FS" data-accent="data" data-modes="escalate">
          <path class="edge-path" d="M 308 452 L 448 452" marker-end="url(#arrow)" />
          <rect class="label-pill" x="366" y="427" width="54" height="20" />
          <text class="edge-label" x="393" y="441" text-anchor="middle">写文件</text>
        </g>

        <!-- Data internal: OD <-> KF (ref("task")) -->
        <g class="edge edge-dashed" id="e-od-kf" data-from="OD" data-to="KF" data-accent="data" data-modes="escalate vo-b">
          <path class="edge-path" d="M 577 204 L 577 174" marker-end="url(#arrow-dashed)" />
          <text class="edge-label" x="586" y="193">ref("task") 外键关联</text>
        </g>

        <!-- Data -> VO: KF + OD -.-> PJ (project(data, kernel)) -->
        <g class="edge edge-dashed" id="e-data-pj" data-from="OD" data-to="PJ" data-accent="vo" data-modes="zero-token vo-b">
          <path class="edge-path" d="M 704 236 L 762 236 L 762 126 L 818 126" marker-end="url(#arrow-dashed)" />
          <path class="edge-path" d="M 704 126 L 762 126" />
          <rect class="label-pill" x="712" y="160" width="102" height="33" />
          <text class="edge-label" x="763" y="174" text-anchor="middle">Live Overlay</text>
          <text class="edge-label" x="763" y="187" text-anchor="middle" style="font-size:9.3px; fill:var(--text-3);">0 Token · 不改 docRev</text>
        </g>

        <!-- VO internal: PJ -> RN (React native skeleton) -->
        <g class="edge" id="e-pj-rn" data-from="PJ" data-to="RN" data-accent="vo" data-modes="zero-token vo-b">
          <path class="edge-path" d="M 896 164 L 896 198" marker-end="url(#arrow)" />
          <text class="edge-label" x="832" y="185">文字骨架</text>
        </g>

        <!-- VO internal: PJ -> HW (HTML Graphic Widget) -->
        <g class="edge" id="e-pj-hw" data-from="PJ" data-to="HW" data-accent="vo" data-modes="zero-token vo-b">
          <path class="edge-path" d="M 1030 164 L 1030 198" marker-end="url(#arrow)" />
          <text class="edge-label" x="1038" y="185">图形 Widget</text>
        </g>

        <!-- VO internal: RN + HW -> RD -->
        <g class="edge edge-dashed" id="e-vo-rd" data-from="HW" data-to="RD" data-accent="vo" data-modes="vo-b">
          <path class="edge-path" d="M 896 356 L 896 396" marker-end="url(#arrow-dashed)" />
          <path class="edge-path" d="M 1030 356 L 1030 396" marker-end="url(#arrow-dashed)" />
          <rect class="label-pill" x="876" y="366" width="174" height="20" />
          <text class="edge-label" x="963" y="380" text-anchor="middle">open_file / open_session 意图</text>
        </g>

        <!-- Data -> VO: FS -.-> RD -->
        <g class="edge edge-dashed" id="e-fs-rd" data-from="FS" data-to="RD" data-accent="vo" data-modes="vo-b">
          <path class="edge-path" d="M 704 440 L 818 440" marker-end="url(#arrow-dashed)" />
          <rect class="label-pill" x="716" y="415" width="94" height="20" />
          <text class="edge-label" x="763" y="429" text-anchor="middle">蓝色文字引用直达</text>
        </g>

        <!-- Bottom bus: WK -.-> KF / RD -->
        <g class="edge edge-dashed" id="e-wk-rd" data-from="WK" data-to="RD" data-accent="vo" data-modes="escalate vo-b">
          <path class="edge-path" d="M 171 478 L 171 524 L 963 524 L 963 482" marker-end="url(#arrow-dashed)" />
          <rect class="label-pill" x="430" y="512" width="286" height="22" />
          <text class="edge-label" x="573" y="527" text-anchor="middle">模型署名点击直达对应 Worker 对话（kernel.tasks）</text>
        </g>

        <!-- ==================== NODES: LOGIC ==================== -->
        <g class="node" id="n-TR" data-id="TR" data-layer="logic" data-modes="zero-token escalate" tabindex="0">
          <rect class="node-rect" x="34" y="88" width="274" height="70" />
          <rect class="node-bar bar-logic" x="34" y="88" width="4" height="70" />
          <text class="node-title" x="49" y="111">Unified Triggers</text>
          <rect class="badge-closed-bg" x="236" y="98" width="60" height="17" />
          <text class="badge-closed-txt" x="266" y="110" text-anchor="middle">封闭原语</text>
          <text class="node-mono" x="49" y="130" style="font-size:8.9px;">cron / data_change / task_settled / schedule_at</text>
          <text class="node-sub" x="49" y="147">开放 when(data, event) 条件 · 展示/执行同源</text>
        </g>

        <g class="node" id="n-CLI" data-id="CLI" data-layer="logic" data-modes="zero-token" tabindex="0">
          <rect class="node-rect" x="34" y="194" width="274" height="66" />
          <rect class="node-bar bar-logic" x="34" y="194" width="4" height="66" />
          <text class="node-title" x="49" y="217">CLI / Plugin Runner</text>
          <rect class="badge-closed-bg" x="236" y="204" width="60" height="17" />
          <text class="badge-closed-txt" x="266" y="216" text-anchor="middle">封闭护栏</text>
          <text class="node-sub" x="49" y="235">零 Token 确定性采集与回归门禁</text>
          <text class="node-mono" x="49" y="250">env allowlist · timeout · stdout patch</text>
        </g>

        <g class="node" id="n-RT" data-id="RT" data-layer="logic" data-modes="escalate" tabindex="0">
          <rect class="node-rect" x="34" y="300" width="274" height="66" />
          <rect class="node-bar bar-logic" x="34" y="300" width="4" height="66" />
          <text class="node-title" x="49" y="323">Routing &amp; Guards</text>
          <rect class="badge-closed-bg" x="236" y="310" width="60" height="17" />
          <text class="badge-closed-txt" x="266" y="322" text-anchor="middle">封闭护栏</text>
          <text class="node-sub" x="49" y="341">role / access 强制模型路由拦截</text>
          <text class="node-mono" x="49" y="356">ApplyTemplateRouting · guardToolCall</text>
        </g>

        <g class="node" id="n-WK" data-id="WK" data-layer="logic" data-modes="escalate vo-b" tabindex="0">
          <rect class="node-rect" x="34" y="404" width="274" height="72" />
          <rect class="node-bar bar-logic" x="34" y="404" width="4" height="72" />

  <script>
    (function () {
      const MODE_NOTES = {
        all: '<strong>设计总纲</strong>：内核只管封闭的执行事实、Schema 写入门禁、极小文字骨架与 4 消息 HTML Bridge；模板自由定义业务 Data、投影规则与任意无框图形 Widget。',
        'zero-token': '<strong>① 0-Token 采集与 Schema 校验</strong>：cron 触发 CLI 采集 → 按模板开放 Schema 原子 Fail-Closed 校验（写错不覆盖旧快照）→ Live Overlay 热推送到双轨 VO，全程 0 Token、不改 docRev。',
        escalate: '<strong>② 越界 / 到期拉起 Worker</strong>：Data 越界、事件到期或前置任务结算 → 经 Routing 强校验模型派发 Worker → 系统事实写入 kernel.tasks，业务结果经 Schema 校验写入 Data Store。',
        'vo-b': '<strong>③ 方案 B 统一 VO 双轨挂载</strong>：上层统一 project(data, kernel) 契约；文字阅读骨架走极小 React 原生集（0ms、Ctrl+F、移动端），所有新图形走无框透明底 HTML Widget（4 消息 Bridge 联动原生阅读器与对话）。'
      };

      const NODE_NOTES = {
        TR: '<strong>Unified Triggers（封闭触发原语）</strong>：仅提供 cron / data_change / task_settled / schedule_at 四种触发源；具体业务逻辑写在模板开放的 when(data, event) 中。',
        CLI: '<strong>CLI / Plugin Runner（封闭沙箱执行）</strong>：环境变量白名单 + 硬超时护栏，专跑每日指标采集与回归门禁，0 LLM Token。',
        RT: '<strong>Routing &amp; Guards（封闭安全护栏）</strong>：统一经 ApplyTemplateRoutingCore，命中 enforce: true 硬拦截违规模型，不可绕过。',
        WK: '<strong>Lead / Worker Sessions（封闭执行体）</strong>：按路由派发并由内核自动写入 kernel.tasks（model / sessionId / gates），AI 不可伪造。',
        KF: '<strong>Kernel Facts（封闭系统事实）</strong>：Task/Session/Gate/Run 与自动元字段 _meta.{updatedAt, source}，AI 严禁手填或篡改。',
        OD: '<strong>Template Data Store（开放业务 Schema）</strong>：彻底淘汰大杂烩 TrackSlot；模板按需声明 stages/valuation/krs/loops，写入时 Fail-Closed 严格校验枚举、ISO 日期与外键。',
        FS: '<strong>Workspace Artifacts（工作区文件）</strong>：深度底稿与代码留在文件系统，通过 t.ref("file") 校验路径在工作区内，正文蓝色文字内联引用。',
        PJ: '<strong>Pure Projection（开放 Data→VO 投影）</strong>：模板编写纯函数 project(data, kernel) 将开放数据映射为统一 VOProps；加载期 dryRun 校验，运行期按单块隔离降级。',
        RN: '<strong>React 文字骨架（极小封闭集）</strong>：锁死 prose / table / stepper / list，保障 0ms 首屏、Ctrl+F 搜索、移动端原生、复用 ProseBlock 且绝无白框或浮层裁切。',
        HW: '<strong>HTML 图形 Widget（无限开放扩展）</strong>：保持 sandbox="allow-scripts" 零权限，通过 data / theme / resize / intent 四消息 Bridge 实现透明底无框沉浸与原生联动，彻底消灭底部白框。',
        RD: '<strong>File Viewer &amp; Worker Drawer（原生联动）</strong>：不论点击 React 骨架还是 HTML Widget 里的引用/模型名，均校验归属后唤起同一个 Perga 原生阅读器与 Worker 对话抽屉。'
      };

      const nodes = Array.from(document.querySelectorAll('.node'));
      const edges = Array.from(document.querySelectorAll('.edge'));
      const buttons = Array.from(document.querySelectorAll('.mode-btn'));
      const footerNote = document.getElementById('footer-note');
      let currentMode = 'all';
      let selectedNode = null;

      function setMarker(edgeEl, active) {
        const paths = edgeEl.querySelectorAll('.edge-path');
        const isDashed = edgeEl.classList.contains('edge-dashed');
        const accent = edgeEl.dataset.accent;
        paths.forEach((path) => {
          if (!path.hasAttribute('marker-end')) return;
          if (!active) {
            path.setAttribute('marker-end', isDashed ? 'url(#arrow-dashed)' : 'url(#arrow)');
          } else if (accent === 'logic') {
            path.setAttribute('marker-end', 'url(#arrow-logic)');
          } else if (accent === 'data') {
            path.setAttribute('marker-end', 'url(#arrow-data)');
          } else if (accent === 'vo') {
            path.setAttribute('marker-end', 'url(#arrow-vo)');
          } else {
            path.setAttribute('marker-end', 'url(#arrow)');
          }
        });
      }

      function applyState() {
        if (selectedNode) {
          const connected = new Set([selectedNode]);
          edges.forEach((e) => {
            const hit = e.dataset.from === selectedNode || e.dataset.to === selectedNode;
            e.classList.toggle('is-active', hit);
            e.classList.toggle('is-dim', !hit);
            setMarker(e, hit);
            if (hit) {
              connected.add(e.dataset.from);
              connected.add(e.dataset.to);
            }
          });
          nodes.forEach((n) => {
            const id = n.dataset.id;
            n.classList.toggle('is-active', id === selectedNode);
            n.classList.toggle('is-dim', !connected.has(id));
          });
          footerNote.innerHTML = NODE_NOTES[selectedNode] || MODE_NOTES.all;
          return;
        }

        if (currentMode === 'all') {
          nodes.forEach((n) => n.classList.remove('is-dim', 'is-active'));
          edges.forEach((e) => {
            e.classList.remove('is-dim', 'is-active');
            setMarker(e, false);
          });
          footerNote.innerHTML = MODE_NOTES.all;
          return;
        }

        nodes.forEach((n) => {
          const modes = (n.dataset.modes || '').split(' ');
          const hit = modes.includes(currentMode);
          n.classList.toggle('is-active', hit);
          n.classList.toggle('is-dim', !hit);
        });
        edges.forEach((e) => {
          const modes = (e.dataset.modes || '').split(' ');
          const hit = modes.includes(currentMode);
          e.classList.toggle('is-active', hit);
          e.classList.toggle('is-dim', !hit);
          setMarker(e, hit);
        });
        footerNote.innerHTML = MODE_NOTES[currentMode] || MODE_NOTES.all;
      }

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedNode = null;
          currentMode = btn.dataset.mode;
          buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          applyState();
        });
      });

      nodes.forEach((n) => {
        const toggle = () => {
          const id = n.dataset.id;
          selectedNode = selectedNode === id ? null : id;
          if (selectedNode) {
            buttons.forEach((b) => b.setAttribute('aria-pressed', 'false'));
          } else {
            buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === currentMode)));
          }
          applyState();
        };
        n.addEventListener('click', toggle);
        n.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            toggle();
          }
        });
      });
    })();
  </script>

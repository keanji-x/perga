name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - 'docs/product/vision.en.md'
      - 'docs/essays/**'
      - 'docs/assets/hero.png'
      - 'templates/equity-research/widgets/range-axis.html'
      - 'src/Perga.Kernel/Templates/Memory/widgets/entries.html'
      - 'fe/web/src/ui/brand/**'
      - 'fe/web/public/icons/**'
      - 'fe/web/src/styles/**'
      - 'fe/web/src/features/report/flow/**'
      - 'fe/web/src/features/report/editorial/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci
      - name: Build GitHub Pages site with real Perga UI components
        run: |
          (cd fe && npx vite build --config ../site/vite.config.mjs)
          install -m 644 install.sh site/dist/install.sh
          test -s site/dist/index.html
          test -s site/dist/vision.html
          test -s site/dist/essays/index.html
          test -s site/dist/essays/rust-to-csharp.html
          test -s site/dist/essays/why-report-centric.html
          test -s site/dist/feed.xml
          test -s site/dist/assets/hero.png
          test -s site/dist/favicon.svg
          test -s site/dist/icon-192.png
          test -s site/dist/install.sh
          test -s site/dist/widgets/range-axis.html
          test -s site/dist/widgets/entries.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

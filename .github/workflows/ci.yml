name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: 'false'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend and terminal bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JJ_USER: Perga CI
      JJ_EMAIL: perga-ci@example.invalid
      BRIDGE_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/perga-oar-bridge/package-lock.json
      - name: Test and build OAR bridge
        working-directory: tools/perga-oar-bridge
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Install Jujutsu for .NET tests
        run: |
          # The VCS suite exercises discovery in ~/.local/bin with PATH overridden.
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/jj.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$archive" \
            https://github.com/jj-vcs/jj/releases/download/v0.28.2/jj-v0.28.2-x86_64-unknown-linux-musl.tar.gz
          echo "c91894dd8b0ae21a10bf3a8530082e480e14d61fa4e3ad0b985268875fa7fb34  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$BRIDGE_TARGET"
      - name: Check terminal bridge formatting
        working-directory: tools/perga-term-bridge
        run: cargo fmt --check
      - name: Test and build terminal bridge
        working-directory: tools/perga-term-bridge
        run: |
          # Test the static bridge that is shipped to other Linux distributions.
          cargo test --locked --release --target "$BRIDGE_TARGET"
          cargo build --locked --release --target "$BRIDGE_TARGET" --bin perga-term-bridge
          bridge="$PWD/target/$BRIDGE_TARGET/release/perga-term-bridge"
          readelf -lW "$bridge" | awk '$1 == "INTERP" { print "Terminal bridge has a dynamic interpreter"; exit 1 }'
          echo "PERGA_TERM_BRIDGE_BIN=$bridge" >> "$GITHUB_ENV"
      - name: Build .NET solution
        run: dotnet build Perga.sln --configuration Release
      - name: Test .NET solution
        # Avoid concurrent builds and test projects competing with PolicyVm's 50 ms clock.
        run: dotnet test Perga.sln --configuration Release --no-build --maxcpucount:1
      - name: Publish Host and bundle terminal bridge and templates
        run: |
          bash tools/publish-host.sh perga "$PERGA_TERM_BRIDGE_BIN" linux-x64
          tar -czf host.tar.gz perga
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: perga-host
          path: host.tar.gz
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        env:
          # The default eight workers oversubscribe hosted runners.
          VITEST_MAX_WORKERS: '2'
        run: npm test -- --testTimeout=15000
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: perga-web
          path: fe/web/dist/
          if-no-files-found: error
          overwrite: true

  browser:
    name: Browser tests (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run advisory Chromium tests
        id: chromium
        continue-on-error: true
        # The test deadline must expire before GitHub cancels the entire job.
        run: timeout --kill-after=15s 15m npm run test:browser -- --bail=1
      - name: Report Chromium test result
        if: steps.chromium.outcome == 'failure'
        run: echo '::warning::The report-only Chromium tests failed or timed out. See the test log.'

  package:
    name: Package ${{ matrix.label }}
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            package: perga-linux-x64
          - label: macOS Apple Silicon
            runner: macos-15
            package: perga-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.os == 'macOS'
        with:
          dotnet-version: '11.0.x'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: runner.os == 'Linux'
        with:
          name: perga-host
      - if: runner.os == 'Linux'
        run: tar -xzf host.tar.gz
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build native Apple Silicon Host and bridges
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          (cd tools/perga-oar-bridge && npm ci && npm run build && npm test)
          rustup toolchain install --no-self-update
          (cd tools/perga-term-bridge && cargo test --locked --release && cargo build --locked --release)
          bridge="$PWD/tools/perga-term-bridge/target/release/perga-term-bridge"
          PERGA_TERM_BRIDGE_BIN="$bridge" dotnet test tests/Perga.TermClient.Tests --configuration Release
          bash tools/publish-host.sh perga "$bridge" osx-arm64
          lipo perga/Perga.Host -verify_arch arm64
          lipo perga/perga-term-bridge -verify_arch arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: perga-web
          path: perga/web/
      - name: Archive and verify the native package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_version="$GITHUB_REF_NAME"
          else
            release_version="dev-${GITHUB_SHA:0:8}"
          fi
          printf '%s\n' "$release_version" > perga/VERSION
          tar -czf "$PACKAGE.tar.gz" perga
          shasum -a 256 "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
          shasum -a 256 -c "$PACKAGE.tar.gz.sha256"
          tar -xzf "$PACKAGE.tar.gz" -C "$RUNNER_TEMP"
          bash tools/smoke-package.sh "$RUNNER_TEMP/perga"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.tar.gz
            ${{ matrix.package }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: install.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: perga-linux-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: perga-darwin-arm64
      - name: Publish verified packages to the version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c perga-linux-x64.tar.gz.sha256 perga-darwin-arm64.tar.gz.sha256
          test -s install.sh
          cat > release-notes.md <<EOF
          ### Install or Upgrade

          **Fresh install (macOS Apple Silicon & Linux x64, no .NET runtime required):**
          \`\`\`sh
          curl -fsSL https://keanji-x.github.io/perga/install.sh | bash
          \`\`\`

          **Pin this exact release:**
          \`\`\`sh
          curl -fsSL https://keanji-x.github.io/perga/install.sh | PERGA_VERSION=${GITHUB_REF_NAME} bash
          \`\`\`

          **Already installed?**
          \`\`\`sh
          perga upgrade
          \`\`\`
          EOF
          assets=(
            perga-linux-x64.tar.gz
            perga-linux-x64.tar.gz.sha256
            perga-darwin-arm64.tar.gz
            perga-darwin-arm64.tar.gz.sha256
            install.sh
          )
          expected_prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            expected_prerelease=true
          fi
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --draft=false --prerelease="$expected_prerelease"
            fi
          else
            flags=(--verify-tag --generate-notes --notes-file release-notes.md)
            if [[ "$expected_prerelease" == "true" ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" "${assets[@]}"
          fi
          published_state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft):\(.isPrerelease)"')
          if [[ "$published_state" != "false:${expected_prerelease}" ]]; then
            echo "error: release ${GITHUB_REF_NAME} ended in unexpected state '${published_state}' (expected 'false:${expected_prerelease}')." >&2
            exit 1
          fi
